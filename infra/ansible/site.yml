# Provision a Raspberry Pi 5 as a PiVault server.
#
# On the Pi (what the SD-card image does on first boot):
#   sudo pivault-apply
#
# From another computer with Ansible (Linux, macOS or WSL):
#   ansible-playbook -i inventory.ini site.yml -e pivault_sync_repo=true
#
# Every task is safe to run again. No task ever formats a drive: that is only done by
# `sudo pivault-setup-disks`, after you confirm.
- name: PiVault server
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Base system
      ansible.builtin.import_tasks: tasks/base.yml
      tags: [base]

    - name: Docker
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker]

    - name: Tailscale
      ansible.builtin.import_tasks: tasks/tailscale.yml
      tags: [tailscale, app]

    - name: Storage
      ansible.builtin.import_tasks: tasks/storage.yml
      tags: [storage]

    - name: Firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      tags: [firewall]

    - name: Scheduled jobs
      ansible.builtin.import_tasks: tasks/backups.yml
      tags: [backups]

    - name: PiVault application
      ansible.builtin.import_tasks: tasks/app.yml
      tags: [app]

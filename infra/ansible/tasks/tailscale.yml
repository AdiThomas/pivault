- name: Add Tailscale's signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale's package repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: >
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
  register: tailscale_repo

- name: Refresh the package list
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo is changed

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Start the Tailscale daemon now and on every boot
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check whether this Pi has joined a tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_before
  changed_when: false
  failed_when: false

- name: Join the tailnet with the auth key
  ansible.builtin.command: >
    tailscale up --authkey={{ tailscale_authkey }} --hostname={{ pivault_hostname }}
  when:
    - tailscale_authkey | length > 0
    - (tailscale_status_before.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  no_log: true
  register: tailscale_up
  failed_when: false

- name: Report an auth key that did not work
  ansible.builtin.debug:
    msg: "The Tailscale auth key was not accepted (it may have expired). Run `sudo tailscale up` on the Pi."
  when: tailscale_up is not skipped and tailscale_up.rc | default(0) != 0

- name: Read this Pi's Tailscale name
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Work out the HTTPS address
  ansible.builtin.set_fact:
    tailscale_running: "{{ (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') == 'Running' }}"
    pivault_domain_effective: >-
      {{ pivault_domain if pivault_domain | length > 0
         else ((tailscale_status.stdout | default('{}') | from_json).Self.DNSName | default('') | regex_replace('\.$', ''))
         if (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') == 'Running'
         else 'localhost' }}

- name: Fall back to localhost when there is no Tailscale name yet
  ansible.builtin.set_fact:
    pivault_domain_effective: localhost
  when: pivault_domain_effective | trim | length == 0

- name: Explain how to finish connecting Tailscale
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed but this Pi has not joined your tailnet. Run
      `sudo tailscale up` on the Pi, open the link it prints, then run
      `sudo pivault-apply app`. Also turn on HTTPS certificates and MagicDNS in the
      Tailscale admin console (DNS page).
  when: not tailscale_running

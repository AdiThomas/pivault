name: End-to-end tests

# Drives the real app (its web build) with Playwright against a real server:
# API, worker, PostgreSQL and Redis from the dev Compose file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the server stack
        run: docker compose -f deploy/docker-compose.dev.yml up -d --build --wait

      - name: Server smoke test
        run: bash scripts/smoke-test.sh http://localhost:8000

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Install the test browser
        working-directory: mobile
        run: npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: mobile
        run: npm run build:web

      - name: Run the tests
        working-directory: mobile
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            mobile/playwright-report
            mobile/test-results
          retention-days: 14

      - name: Server logs
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --tail 200

name: Release

# Push a tag like v1.2.0 to build images for the Pi (arm64) and your PC (amd64) and
# publish them to the GitHub Container Registry.
#
# The optional deploy job then updates the Pi over Tailscale. To turn it on, set the
# repository variable PIVAULT_DEPLOY to "true" and add these:
#   variable  PIVAULT_HOST         your Pi's Tailscale name (pivault.<tailnet>.ts.net)
#   secret    TS_OAUTH_CLIENT_ID   Tailscale OAuth client with the tag:ci tag
#   secret    TS_OAUTH_SECRET
#   secret    PIVAULT_SSH_KEY      private key allowed to SSH to the Pi as "pi"
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pivault-backend
            context: backend
            dockerfile: backend/Dockerfile
            target: runtime
          - name: pivault-web
            context: .
            dockerfile: deploy/web.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: vars.PIVAULT_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PIVAULT_SSH_KEY }}
          PIVAULT_HOST: ${{ vars.PIVAULT_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PIVAULT_HOST" >> ~/.ssh/known_hosts

      - name: Copy the deployment files
        env:
          PIVAULT_HOST: ${{ vars.PIVAULT_HOST }}
        run: |
          rsync -az --delete --exclude '.env' deploy/ "pi@$PIVAULT_HOST:/tmp/pivault-deploy/"
          rsync -az --delete scripts/ "pi@$PIVAULT_HOST:/tmp/pivault-scripts/"

      - name: Pull the new images and restart
        env:
          PIVAULT_HOST: ${{ vars.PIVAULT_HOST }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: ssh "pi@$PIVAULT_HOST" "sudo bash /tmp/pivault-scripts/deploy-release.sh '$OWNER' '${VERSION#v}'"
